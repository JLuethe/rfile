version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The versioned action is our supported minimum, not an upgrade target.
    # Review changes to the public MSRV deliberately alongside Cargo.toml.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    open-pull-requests-limit: 3
