[package]
name = "rfile-fuzz"
version = "0.0.0"
publish = false
license = "GPL-3.0-only"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rfile = { path = "..", features = ["extended-codecs"] }

[workspace]
members = ["."]

