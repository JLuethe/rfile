[package]
name = "rfile-platform"
version = "0.2.0-rc.1"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-only"
publish = false
description = "Narrow platform boundary for rfile locale and confinement services"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "=0.2.191"

[features]
sandbox = ["dep:landlock", "dep:seccompiler", "dep:rustix"]

[target.'cfg(all(target_os = "linux", target_env = "gnu", target_arch = "x86_64"))'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"], optional = true }
landlock = { version = "=0.4.7", optional = true }
seccompiler = { version = "=0.5.0", default-features = false, optional = true }
